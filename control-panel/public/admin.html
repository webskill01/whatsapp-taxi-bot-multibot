<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bot Control Panel — Admin</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2e38; --txt:#e6e8ec; --muted:#8a909c;
          --grn:#2ecc71; --red:#e74c3c; --amber:#f39c12; --blu:#3498db; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size:18px; margin:0; }
  .wrap { padding:20px; max-width:1100px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .bot { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px; }
  .bot:last-child { border-bottom:none; }
  .name { font-weight:600; font-size:15px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em; }
  .on { background:rgba(46,204,113,.15); color:var(--grn); }
  .off { background:rgba(231,76,60,.15); color:var(--red); }
  .pausedb { background:rgba(243,156,18,.18); color:var(--amber); }
  button { background:#262b34; color:var(--txt); border:1px solid var(--line); padding:7px 12px; border-radius:7px; cursor:pointer; font-size:13px; }
  button:hover { background:#2f353f; }
  button.danger { border-color:#5a2a2a; color:#ff8a80; }
  button.go { border-color:#2a5a3a; color:#a5f3c4; }
  input { background:#11141a; border:1px solid var(--line); color:var(--txt); padding:8px 10px; border-radius:7px; font-size:13px; }
  .muted { color:var(--muted); font-size:12px; }
  .grp { display:flex; justify-content:space-between; gap:10px; padding:8px; border:1px solid var(--line); border-radius:7px; margin:6px 0; align-items:center; }
  .grp.newgrp { border-color:#3a4a2a; background:rgba(46,204,113,.06); }
  .gid { font-family:monospace; font-size:11px; color:var(--muted); word-break:break-all; }
  dialog { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:12px; max-width:560px; width:92%; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  .pill { font-size:10px; padding:1px 7px; border-radius:20px; }
  .pill.source { background:rgba(52,152,219,.18); color:var(--blu); }
  .pill.target { background:rgba(46,204,113,.15); color:var(--grn); }
  .pill.other { background:rgba(138,144,156,.15); color:var(--muted); }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#262b34; border:1px solid var(--line); padding:10px 16px; border-radius:8px; opacity:0; transition:.2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>🎛️ Bot Control Panel <span class="muted">· admin</span></h1>
  <button onclick="loadBots()">⟳ Refresh</button>
</header>
<div class="wrap">
  <div class="card" id="bots"><div class="muted">Loading bots…</div></div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <strong>🚫 Shared block list</strong>
      <span class="muted" id="blockCounts"></span>
    </div>
    <div class="row" style="margin-top:12px">
      <input id="numIn" placeholder="block number(s) — any format" style="flex:1;min-width:220px" />
      <button class="go" onclick="submitBlock('number')">Block number</button>
      <button onclick="submitBlock('sender')">Block sender</button>
    </div>
    <div class="row" style="margin-top:10px">
      <input id="ignIn" placeholder="ignore phrase (e.g. khali)" style="flex:1;min-width:220px" />
      <button onclick="submitIgnore()">Add ignore</button>
      <button onclick="openList()">Manage list…</button>
    </div>
  </div>
</div>

<dialog id="qrDlg"><div style="padding:18px;text-align:center" id="qrBody"></div>
  <div style="padding:0 18px 18px;text-align:right"><button onclick="qrDlg.close()">Close</button></div></dialog>
<dialog id="grpDlg"><div style="padding:18px" id="grpBody"></div>
  <div style="padding:0 18px 18px;text-align:right"><button onclick="grpDlg.close()">Close</button></div></dialog>
<dialog id="listDlg"><div style="padding:18px" id="listBody"></div>
  <div style="padding:0 18px 18px;text-align:right"><button onclick="listDlg.close()">Close</button></div></dialog>
<div id="toast"></div>

<script>
const token = new URLSearchParams(location.search).get("token") || "";
const H = { "x-token": token, "Content-Type": "application/json" };
const api = (p, opt={}) => fetch(p + (p.includes("?")?"&":"?") + "token=" + token, opt).then(r=>r.json());
const post = (p, body) => api(p, { method:"POST", headers:H, body:JSON.stringify(body||{}) });
let qrTimer = null;

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }

async function loadBots(){
  const r = await api("/api/bots");
  if (r.error){ document.getElementById("bots").innerHTML = `<div class="off">${r.error}</div>`; return; }
  document.getElementById("bots").innerHTML = r.bots.map(botRow).join("");
  loadCounts();
}
function botRow(b){
  const st = b.pm2.status;
  const online = st === "online";
  const paused = b.runtime?.paused;
  const dis = (b.runtime?.disabledTargets||[]).length;
  return `<div class="bot">
    <div>
      <div class="name">${b.id}
        <span class="badge ${online?'on':'off'}">${st}</span>
        ${paused?'<span class="badge pausedb">paused</span>':''}
        ${dis?`<span class="badge pausedb">${dis} target off</span>`:''}
      </div>
      <div class="muted">port ${b.statsPort} · restarts ${b.pm2.restarts ?? '–'}</div>
    </div>
    <div class="row">
      <button onclick="togglePause('${b.id}', ${!paused})">${paused?'▶ Resume':'⏸ Pause'}</button>
      <button onclick="showGroups('${b.id}')">👥 Groups</button>
      <button onclick="showQR('${b.id}')">📱 QR</button>
      <button class="go" onclick="act('${b.id}','restart','Restart this bot?')">↻ Restart</button>
      <button class="danger" onclick="act('${b.id}','reset','RESET AUTH? This logs the bot out and needs a new QR scan.')">⚠ Reset</button>
    </div>
  </div>`;
}

async function act(id, action, confirmMsg){
  if (!confirm(confirmMsg)) return;
  const r = await post(`/api/bot/${id}/${action}`, {});
  toast(r.message || r.error || "done");
  setTimeout(loadBots, 1500);
}
async function togglePause(id, paused){
  const r = await post(`/api/bot/${id}/pause`, { paused });
  toast(r.error || (paused?"Paused":"Resumed")); loadBots();
}

async function showQR(id){
  const body = document.getElementById("qrBody");
  body.innerHTML = "<div class='muted'>Loading QR…</div>"; qrDlg.showModal();
  const tick = async () => {
    const r = await api(`/api/bot/${id}/qr`);
    if (r.qr){ body.innerHTML = `<div style="margin-bottom:8px">Scan with WhatsApp → Linked devices</div><img src="${r.qr}" style="width:280px;border-radius:8px"/>`; }
    else { body.innerHTML = `<div class="muted">${r.error||'No QR right now (bot may be connected). Reset auth to force a new one.'}</div>`; }
  };
  await tick(); clearInterval(qrTimer); qrTimer = setInterval(tick, 4000);
}
qrDlg.addEventListener("close", ()=>clearInterval(qrTimer));

async function showGroups(id){
  const body = document.getElementById("grpBody");
  body.innerHTML = "<div class='muted'>Fetching groups…</div>"; grpDlg.showModal();
  const r = await api(`/api/bot/${id}/groups`);
  if (!r.groups){ body.innerHTML = `<div class="off">${r.error||'Bot not connected'}</div>`; return; }
  // Unmonitored (new) groups first — that's the "find the new group id" workflow.
  const sorted = [...r.groups].sort((a,b)=> (a.type==='other'?-1:1) - (b.type==='other'?-1:1));
  body.innerHTML = `<strong>${id}</strong> <span class="muted">· ${r.totalGroups} groups · ${r.breakdown.unmonitored} unmonitored</span>
    <div style="max-height:60vh;overflow:auto;margin-top:10px">` +
    sorted.map(g=>`<div class="grp ${g.type==='other'?'newgrp':''}">
      <div><div>${g.name} <span class="pill ${g.type}">${g.category}</span></div>
        <div class="gid">${g.id}</div></div>
      <button onclick="copyId('${g.id}')">Copy ID</button></div>`).join("") + `</div>`;
}
function copyId(id){ navigator.clipboard.writeText(id); toast("Group ID copied"); }

async function loadCounts(){
  const r = await api("/api/block/list");
  if (r.counts) document.getElementById("blockCounts").textContent =
    `${r.counts.blockedPhoneNumbers} numbers · ${r.counts.blockedSenders} senders · ${r.counts.ignoreIfContains} ignore`;
}
async function submitBlock(kind){
  const input = document.getElementById("numIn").value.trim();
  if (!input) return;
  const r = await post(`/api/block/${kind}`, { input });
  const parts=[]; if(r.added?.length)parts.push(`added ${r.added.join(", ")}`);
  if(r.dupes?.length)parts.push(`already had ${r.dupes.join(", ")}`);
  if(r.invalid?.length)parts.push(`invalid ${r.invalid.join(", ")}`);
  toast(parts.join(" · ")||"nothing to do"); document.getElementById("numIn").value=""; loadCounts();
}
async function submitIgnore(){
  const phrase = document.getElementById("ignIn").value.trim(); if(!phrase) return;
  const r = await post("/api/block/ignore", { phrase });
  toast(r.added?`added "${r.phrase}"`:(r.reason==='duplicate'?'already in list':'nothing to do'));
  document.getElementById("ignIn").value=""; loadCounts();
}
async function openList(){
  const r = await api("/api/block/list");
  if (!r.data){ toast("admin only"); return; }
  const body = document.getElementById("listBody");
  const section = (title, field, arr) => `<details><summary>${title} (${arr.length})</summary>
    <div style="max-height:30vh;overflow:auto;margin:8px 0">` +
    arr.map(v=>`<div class="grp"><span class="gid">${v}</span>
      <button class="danger" onclick="removeEntry('${field}','${String(v).replace(/'/g,"")}')">Remove</button></div>`).join("") + `</div></details>`;
  body.innerHTML = `<strong>Manage block list</strong>` +
    section("Blocked numbers","blockedPhoneNumbers",r.data.blockedPhoneNumbers) +
    section("Blocked senders","blockedSenders",r.data.blockedSenders) +
    section("Ignore phrases","ignoreIfContains",r.data.ignoreIfContains);
  listDlg.showModal();
}
async function removeEntry(field,value){
  const r = await post("/api/block/remove",{field,value});
  toast(r.removed?`removed (${r.removed})`:"not found"); openList(); loadCounts();
}

if (!token) document.getElementById("bots").innerHTML = "<div class='off'>Missing ?token= in URL</div>";
else loadBots();
setInterval(loadBots, 15000);
</script>
</body>
</html>
